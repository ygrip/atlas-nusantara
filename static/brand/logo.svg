<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>Nusantara Atlas</title>
  <defs>
    <linearGradient id="nusa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f8e8"/>
      <stop offset="1" stop-color="#bddcc4"/>
    </linearGradient>
    <linearGradient id="nusa-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0ad"/>
      <stop offset="1" stop-color="#f2a35c"/>
    </linearGradient>
    <linearGradient id="nusa-land" x1="0" y1="0" x2="0" y2="1">
