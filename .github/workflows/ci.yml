name: Validate scaffold
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Initial scaffold has no lockfile because dependency installation
      # cannot be validated in this connector environment. Commit one once
      # npm install succeeds; then switch to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run check:locales
      - run: npm run check
      - run: npm run build
