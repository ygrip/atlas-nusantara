name: Validate atlas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Also redeploy the scheduler Worker after successful validation (main only)'
        type: boolean
        default: false

# Cancel superseded runs before they can publish an older production build.
concurrency:
  group: atlas-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # This key is PUBLIC and compiled into browser JS, not a Turnstile secret.
    # Override via GitHub Actions repository variable when rotating the site key.
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAFpTFqEhiXanSRaa' }}
    outputs:
      worker_changed: ${{ steps.worker_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect scheduler Worker changes
        id: worker_changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" |
            grep -Eq '^(wrangler\.jsonc$|cloudflare/|src/lib/data/ingestion/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject committed credential material
        run: node scripts/check-committed-secrets.mjs
      - name: Check Pages/Worker production bindings
        run: node scripts/check-deployment-config.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run check:locales
      - run: npm run check
      - run: npm run worker:check
      - run: npm test
      - run: npm run build
      - run: npm run worker:dry-run
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npx playwright test --grep '@smoke' --workers=2 --reporter=line
      # Only a validated main build may become a production artifact.
      - name: Upload validated Pages/Worker assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-validated-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy Cloudflare Pages
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: atlas-validated-build
          path: build/
      - name: Check deployment credentials and build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -f build/index.html || { echo "::error::Validated Pages artifact is missing"; exit 1; }
          node scripts/check-deployment-config.mjs
      - name: Deploy validated Pages build (with Functions and D1 binding)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy --cwd pages --branch main --commit-hash "$GITHUB_SHA"

  deploy-worker:
    name: Deploy scheduler Worker (only if changed)
    needs: [check, deploy-pages]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.check.outputs.worker_changed == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_worker))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: atlas-validated-build
          path: build/
      - name: Check credentials and validated Worker assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -f build/index.html || { echo "::error::Validated Worker assets are missing"; exit 1; }
          node scripts/check-deployment-config.mjs
      - name: Deploy scheduler Worker (D1 and cron bindings from wrangler.jsonc)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
