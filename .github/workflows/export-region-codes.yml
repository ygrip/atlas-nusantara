name: Export historical region codes (2022)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/export-region-codes.yml'
      - 'scripts/import-regions.mjs'
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch archived 2022 decision transcription
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/cahyadsn/wilayah/master/db/archive/wilayah_2023.sql' \
            --output /tmp/wilayah_2023.sql
          sha256sum /tmp/wilayah_2023.sql
      - name: Export and verify the administrative hierarchy
        run: node scripts/import-regions.mjs --input /tmp/wilayah_2023.sql
      - name: Publish full region-code archive
        uses: actions/upload-artifact@v4
        with:
          name: kemendagri-2022-administrative-codes
          path: static/data/admin-2022/
          retention-days: 30
          if-no-files-found: error
