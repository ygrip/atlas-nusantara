name: Refresh mountain atlas
on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'
  push:
    paths:
      - scripts/geo/build-mountains.mjs
      - scripts/geo/mountains-source.mjs
      - .github/workflows/mountains.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate complete BIG datasets
        run: node scripts/geo/build-mountains.mjs
      - name: Commit updated versioned snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/observations/mountains.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh BIG national mountain atlas"
            git push
          fi
