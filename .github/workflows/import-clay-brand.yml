name: Import approved clay brand assets
on:
  push:
    branches: [design/clay-indonesia-brandmark]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render pinned artwork as site and PWA icons
        env:
          ART_URL: https://v3b.fal.media/files/b/0ab003a4/jnyRIFlFaezhbKE0594YW_indonesian_archipelago_compass_badge.png
          ART_SHA256: c3e62214700936d6be1e19030178f0b550937a9a9a628fe21a43398f888c0a3b
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          from urllib.request import urlopen
          from PIL import Image

          with urlopen(os.environ['ART_URL'], timeout=90) as response:
              raw = response.read()
          assert hashlib.sha256(raw).hexdigest() == os.environ['ART_SHA256'], 'Approved original image checksum mismatch'
          original = Image.open(io.BytesIO(raw)).convert('RGBA')
          assert original.width == original.height and original.width >= 1024
          brand = Path('static/brand')
          brand.mkdir(parents=True, exist_ok=True)
          high_res = original.resize((768, 768), Image.Resampling.LANCZOS)
          high_res.save(brand / 'indonesia-clay.webp', 'WEBP', quality=87, method=6)
          favicon = original.resize((64, 64), Image.Resampling.LANCZOS)
          favicon.save(brand / 'favicon-64.png', 'PNG', optimize=True)
          for size in [192, 512]:
              canvas = Image.new('RGBA', (size, size), '#f6f0e7')
              inset = round(size * 0.04)
              emblem = original.resize((size - 2 * inset, size - 2 * inset), Image.Resampling.LANCZOS)
              canvas.alpha_composite(emblem, (inset, inset))
              canvas.convert('RGB').save(f'static/icon-{size}.png', 'PNG', optimize=True)
          print('Generated brand artwork, favicon, 192px and 512px icons')
          PY
      - name: Commit icon assets and remove one-time importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-clay-brand.yml
          git add static/brand/indonesia-clay.webp static/brand/favicon-64.png static/icon-192.png static/icon-512.png
          git commit -m "assets(brand): install approved Indonesia clay emblem and app icons"
          git push origin HEAD:design/clay-indonesia-brandmark
