name: Build Wikipedia cuisine catalog

on:
  push:
    branches: [feat/cuisine-recipe-catalog]
    paths:
      - '.github/workflows/cuisine-build.yml'
      - 'scripts/recipes/build.mjs'
      - 'scripts/recipes/seed.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe upstream availability
        run: |
          for url in \
            'https://id.wikipedia.org/wiki/Daftar_masakan_Indonesia' \
            'https://id.wikipedia.org/w/api.php?action=query&format=json&meta=siteinfo' \
            'https://id.wikipedia.org/w/rest.php/v1/page/Daftar_masakan_Indonesia/html' \
            'https://id.m.wikipedia.org/wiki/Daftar_masakan_Indonesia' \
            'https://www.wikidata.org/w/api.php?action=query&format=json&meta=siteinfo'; do
            printf '%s ' "$url"
            curl --max-time 12 --silent --location --output /dev/null --write-out '%{http_code}\n' "$url" || true
          done
      - name: Aggregate Wikipedia and MIT recipe dataset, enrich images
        run: node scripts/recipes/build.mjs
      - name: Verify generated catalog
        run: node --test tests/geo/cuisine.test.mjs
      - name: Commit generated province shards and national export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/cuisine/
          if ! git diff --cached --quiet; then
            git commit -m "data(cuisine): aggregate Wikipedia, recipe corpus and Commons images"
            git push origin HEAD:feat/cuisine-recipe-catalog
          fi
